name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to build, e.g. 1.0.0
        required: true

permissions:
  contents: write

jobs:
  windows-and-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
      - name: version
        id: v
        run: echo "wert=${GITHUB_REF_NAME#v}${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
      - name: build
        run: |
          mkdir -p dist
          marke="-s -w -X github.com/Dschonas04/quicksend/internal/dienst.Version=${{ steps.v.outputs.wert }}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$marke" -o dist/Quicksend.exe ./cmd/quicksend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$marke" -o dist/quicksend-linux-amd64 ./cmd/quicksend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$marke" -o dist/quicksend-linux-arm64 ./cmd/quicksend
          (cd dist && sha256sum * > pruefsummen-windows-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
      - name: version
        id: v
        run: echo "wert=${GITHUB_REF_NAME#v}${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
      - name: build app bundle and dmg
        run: |
          set -eu
          fassung="${{ steps.v.outputs.wert }}"
          marke="-s -w -X github.com/Dschonas04/quicksend/internal/dienst.Version=$fassung"
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$marke" -o quicksend-amd64 ./cmd/quicksend
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$marke" -o quicksend-arm64 ./cmd/quicksend
          lipo -create -output quicksend-universal quicksend-amd64 quicksend-arm64
          paket="dist/Quicksend.app"
          mkdir -p "$paket/Contents/MacOS"
          cp quicksend-universal "$paket/Contents/MacOS/quicksend"
          chmod +x "$paket/Contents/MacOS/quicksend"
          cat > "$paket/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Quicksend</string>
            <key>CFBundleDisplayName</key><string>Quicksend</string>
            <key>CFBundleIdentifier</key><string>io.github.dschonas04.quicksend</string>
            <key>CFBundleVersion</key><string>$fassung</string>
            <key>CFBundleShortVersionString</key><string>$fassung</string>
            <key>CFBundleExecutable</key><string>quicksend</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
            <key>NSLocalNetworkUsageDescription</key>
            <string>Quicksend sucht im lokalen Netz nach Geräten, an die es Dateien senden kann.</string>
            <key>NSBonjourServices</key>
            <array><string>_quicksend._tcp</string></array>
          </dict>
          </plist>
          PLIST
          hdiutil create -volname Quicksend -srcfolder dist/Quicksend.app -ov -format UDZO "dist/Quicksend-$fassung-macos.dmg"
          rm -rf "$paket"
          (cd dist && shasum -a 256 * > pruefsummen-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  veroeffentlichen:
    needs: [windows-and-linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: alle
      - run: ls -R alle
      - uses: softprops/action-gh-release@v2
        with:
          files: alle/**/*
          generate_release_notes: true
